// Groovy to match mods/keystrokes and upstream's Legacy Fabric template.
plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.16-SNAPSHOT"
    id "legacy-looming" version "1.16-SNAPSHOT"
}

version = "1.0.0"
group = "dev.mcclient"
base { archivesName = "mcclient-mods" }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.8.9"
    mappings(legacy.yarn("1.8.9", "604"))
    modImplementation "net.fabricmc:fabric-loader:0.18.3"

    // The scoreboard parser is deliberately free of Minecraft types so it can be tested directly.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "failed" }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
